<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f5">
  <meta name="description" content="Friends Pharmacy multi-branch point-of-sale and inventory">
  <title>Friends Pharmacy POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header>
    <div class="logo"><span class="pill" aria-hidden="true"></span>FRIENDS PHARMACY</div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <button class="btn alt sm" id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button>
  </header>
  <main id="app"></main>
  <dialog id="dlg" aria-label="Pharmacy dialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="loading" class="loading-overlay" role="status" aria-live="polite" aria-atomic="true">
    <div class="loading-card"><span class="spinner" aria-hidden="true"></span><span>Loading...</span></div>
  </dialog>
</body>
</html>
